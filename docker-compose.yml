version: '3.9'

services:

  # 1. PostgreSQL Database
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: aiplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 2. Redis (message broker for Celery)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 3. Django Web Server
  web:
    build: .
    command: python -m daphne -b 0.0.0.0 -p 8000 core.asgi:application
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=change-me-in-production
      - DEBUG=True
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/aiplatform
    depends_on:
      - db
      - redis

  # 4. Celery Worker (background tasks)
  worker:
    build: .
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
      - media_data:/app/media
    environment:
      - SECRET_KEY=change-me-in-production
      - DEBUG=True
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/aiplatform
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  media_data:
